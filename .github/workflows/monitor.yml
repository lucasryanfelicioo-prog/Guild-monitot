name: Monitor Guild NTO

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-guild:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Rodar checagem da guild
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: python monitor_guild.py

      - name: Salvar estado atualizado no repositorio
        run: |
          git config user.name "guild-monitor-bot"
          git config user.email "actions@github.com"
          git add guild_state.json
          git diff --quiet --cached || git commit -m "Atualiza estado da guild [skip ci]"
          git push
